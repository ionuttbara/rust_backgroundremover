[package]
name = "rustbackremover"
version = "0.2.1"
edition = "2021"
build = "build.rs"
description = "AI image background remover with Slint GUI and Explorer Actions"

[features]
default = []
integrated = [] # Build with birefnetv2-img.onnx embedded in the executable.

[dependencies]
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.24", features = ["png", "jpeg", "webp", "avif"] }
ort = { version = "2.0.0-rc.12", features = ["cuda", "directml", "ndarray"] }
rfd = "0.15"
slint = { version = "1.17.1", features = ["unstable-winit-030"] }
walkdir = "2.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_Foundation"
] }
winreg = "0.52"

[build-dependencies]
winresource = "0.1.31"
